[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-gates-images"
version = "0.1.0"
description = "Image experiments for 'Online Class Posteriors for Interpretable and Controllable Discrete Diffusion'"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
