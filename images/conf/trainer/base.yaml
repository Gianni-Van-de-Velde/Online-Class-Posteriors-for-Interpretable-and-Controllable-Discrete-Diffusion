# Training loop (the objective is configured in dfm.yaml)
dir: outputs/${now:%Y-%m-%d-%H-%M-%S}
resume: True
max_steps: 1000000
eval_steps: 1000
save_steps: 10000
max_checkpoints: 1000
gradient_clipping: 1
gradient_accumulation_steps: 1
tf32: True
disable_tqdm: False
use_ema: false
ema_decay: 0.9999  # MD4 value
