[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-gates-antibody"
version = "0.1.0"
description = "Antibody experiments for 'Online Class Posteriors for Interpretable and Controllable Discrete Diffusion'"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT License" }

[tool.setuptools.packages.find]
where = ["src"]
