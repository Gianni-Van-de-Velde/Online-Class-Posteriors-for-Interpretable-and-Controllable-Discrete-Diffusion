_name_: DDLM

train:
  max_length: 512
  padding: max_length
  pad_to_multiple_of: 8
  random_truncate: True
  diffusion_type: 'uniform'
  scheduler_type: 'linear'
  polynomial_power: 1
  t_max_train: 1.0
  t_min_train: 0.0
  num_workers: 4
  per_device_batch_size: 16
  label_smoothing: 0
  use_loss_weighting: False
  num_bins: 10
  label_dropout_prob: 0.15      # CFG: probability of replacing the label by the unconditional token

validation:
  max_length: 512
  padding: max_length
  pad_to_multiple_of: 8
  random_truncate: True
  diffusion_type: 'uniform'
  scheduler_type: 'linear'
  polynomial_power: 1
  t_max_train: 1.0
  t_min_train: 0.0
  num_workers: 4
  per_device_batch_size: 16
  label_smoothing: 0
  use_loss_weighting: False
  num_bins: 10
